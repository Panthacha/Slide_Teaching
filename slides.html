        /* Custom Retro 90s CSS Variables & Styling */
        :root {
            --win-bg: #c0c0c0;
            --win-border-light: #ffffff;
            --win-border-mid: #dfdfdf;
            --win-border-dark: #808080;
            --win-border-darker: #000000;
            --win-title-blue: linear-gradient(90deg, #000080, #1084d0);
            --win-title-inactive: linear-gradient(90deg, #808080, #b5b5b5);
            --xp-grass: #4fa625;
            --xp-sky: #4b8ae0;
        }

        body {

            background-color: #008080;
            overflow: hidden;
            user-select: none;
            font-size: 1.15rem;
        }

        .font-pixel-heading {
            font-family: 'Press Start 2P', cursive;
        }

        .font-pixel-body {
            font-family: 'VT323', monospace;
        }

        /* Win95 Bevel Effects */
        .win-outset {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            box-shadow: inset 1px 1px 0 var(--win-border-mid), inset -1px -1px 0 var(--win-border-dark);
        }

        .win-inset {
            background-color: #ffffff;
            border-top: 2px solid var(--win-border-darker);
            border-left: 2px solid var(--win-border-darker);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            box-shadow: inset 1px 1px 0 var(--win-border-dark), inset -1px -1px 0 var(--win-border-mid);
        }

        .win-button {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            box-shadow: inset 1px 1px 0 var(--win-border-mid), inset -1px -1px 0 var(--win-border-dark);
            cursor: pointer;
            active: flex;
            transition: all 0.05s ease;
        }

        .win-button:active {
            border-top: 2px solid var(--win-border-darker);
            border-left: 2px solid var(--win-border-darker);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            box-shadow: inset 1px 1px 0 var(--win-border-dark), inset -1px -1px 0 var(--win-border-mid);
            padding-top: 2px;
            padding-left: 2px;
        }

        /* Wallpaper Retro Bliss 8-bit Style */
        .pixel-wallpaper {
            background: linear-gradient(to bottom, #3b82f6 0%, #60a5fa 55%, #22c55e 55%, #15803d 100%);
            position: relative;
        }

        .pixel-wallpaper::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 0);
            background-size: 12px 12px;
            pointer-events: none;
        }

        /* Titlebar Gradient */
        .win-titlebar {
            background: var(--win-title-blue);
        }

        /* Pixel Cloud & Decor */
        .pixel-cloud {
            width: 80px;
            height: 24px;
            background: white;
            box-shadow: 
                8px -8px 0 white, 16px -8px 0 white, 24px -8px 0 white,
                32px -16px 0 white, 40px -16px 0 white, 48px -16px 0 white,
                56px -8px 0 white, 64px -8px 0 white,
                -8px 8px 0 rgba(0,0,0,0.1), 80px 8px 0 rgba(0,0,0,0.1);
            position: absolute;
            opacity: 0.85;
        }

        /* Slide Transition Animations */
        .slide-enter {
            animation: pixelSlideIn 0.35s cubic-bezier(0, 0, 0.2, 1) forwards;
        }

        @keyframes pixelSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Retro Scrollbar */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
            background-color: #dfdfdf;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
        }
        ::-webkit-scrollbar-button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            width: 16px;
            height: 16px;
        }

        /* Blink effect */
        .pixel-blink {
            animation: blinker 1s step-start infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>

        /* ==========================================================================
           APPLICATION STATE & AUDIO SYNTHESIZER

        let currentSlide = 0;

        // Web Audio API Retro Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 440, type = 'square', duration = 0.08) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function playChime() {
            if (!soundEnabled) return;
            playBeep(523.25, 'triangle', 0.1); // C5
            setTimeout(() => playBeep(659.25, 'triangle', 0.1), 80); // E5
            setTimeout(() => playBeep(783.99, 'triangle', 0.15), 160); // G5
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;

                showRetroModal('Sound System', 'Sound Effects: MUTED');
            }
        }

            setInterval(updateClock, 1000);

            // Close start menu when clicking outside
            document.addEventListener('click', (e) => {
                const startMenu = document.getElementById('startMenu');
                const btnStart = document.getElementById('btnStart');
                if (!startMenu.contains(e.target) && !btnStart.contains(e.target)) {
                    startMenu.classList.add('hidden');
                }
            });
        };
    </script>
</body>
</html>
