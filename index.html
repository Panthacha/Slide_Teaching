<html lang="th">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Custom Retro 90s CSS Variables & Styling */
        :root {
            --win-bg: #c0c0c0;
            --win-border-light: #ffffff;
            --win-border-mid: #dfdfdf;
            --win-border-dark: #808080;
            --win-border-darker: #000000;
            --win-title-blue: linear-gradient(90deg, #000080, #1084d0);
            --win-title-inactive: linear-gradient(90deg, #808080, #b5b5b5);
            --xp-grass: #4fa625;
            --xp-sky: #4b8ae0;
        }

        body {
            font-family: 'VT323', 'Sarabun', monospace;
            background-color: #008080;
            overflow: hidden;
            user-select: none;
            font-size: 1.15rem;
        }

        .font-pixel-heading {
            font-family: 'Press Start 2P', cursive;
        }

        .font-pixel-body {
            font-family: 'VT323', monospace;
        }

        /* Win95 Bevel Effects */
        .win-outset {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            box-shadow: inset 1px 1px 0 var(--win-border-mid), inset -1px -1px 0 var(--win-border-dark);
        }

        .win-inset {
            background-color: #ffffff;
            border-top: 2px solid var(--win-border-darker);
            border-left: 2px solid var(--win-border-darker);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            box-shadow: inset 1px 1px 0 var(--win-border-dark), inset -1px -1px 0 var(--win-border-mid);
        }

        .win-button {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-border-light);
            border-left: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-darker);
            border-bottom: 2px solid var(--win-border-darker);
            box-shadow: inset 1px 1px 0 var(--win-border-mid), inset -1px -1px 0 var(--win-border-dark);
            cursor: pointer;
            active: flex;
            transition: all 0.05s ease;
        }

        .win-button:active {
            border-top: 2px solid var(--win-border-darker);
            border-left: 2px solid var(--win-border-darker);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            box-shadow: inset 1px 1px 0 var(--win-border-dark), inset -1px -1px 0 var(--win-border-mid);
            padding-top: 2px;
            padding-left: 2px;
        }

        /* Wallpaper Retro Bliss 8-bit Style */
        .pixel-wallpaper {
            background-image: url('images_slide/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Titlebar Gradient */
        .win-titlebar {
            background: var(--win-title-blue);
        }

        /* Pixel Cloud & Decor */
        .pixel-cloud {
            width: 80px;
            height: 24px;
            background: white;
            box-shadow: 
                8px -8px 0 white, 16px -8px 0 white, 24px -8px 0 white,
                32px -16px 0 white, 40px -16px 0 white, 48px -16px 0 white,
                56px -8px 0 white, 64px -8px 0 white,
                -8px 8px 0 rgba(0,0,0,0.1), 80px 8px 0 rgba(0,0,0,0.1);
            position: absolute;
            opacity: 0.85;
        }

        /* Slide Transition Animations */
        .slide-enter {
            animation: pixelSlideIn 0.35s cubic-bezier(0, 0, 0.2, 1) forwards;
        }

        @keyframes pixelSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Retro Scrollbar */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
            background-color: #dfdfdf;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
        }
        ::-webkit-scrollbar-button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            width: 16px;
            height: 16px;
        }

        /* Blink effect */
        .pixel-blink {
            animation: blinker 1s step-start infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>

    <!-- MAIN APPLICATION WINDOW (WIN 95 SLIDE CONTAINER) -->
    <main id="mainWindow" class="hidden relative z-10 my-auto mx-auto w-[96vw] max-w-5xl h-[86vh] flex flex-col win-outset shadow-2xl overflow-hidden rounded-xs">
        
        <!-- Window Title Bar -->

        <div class="flex flex-col gap-0.5 max-h-72 overflow-y-auto text-sm font-pixel-body" id="startMenuList">
            <!-- Dynamic Slide List Items Generated Here -->

    </div>

    <!-- RETRO ALERT MODAL DIALOG -->
    <div id="retroModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs">
        <div class="win-outset w-11/12 max-w-md p-1 shadow-2xl">

                <button onclick="closeRetroModal()" class="win-button w-5 h-5 flex items-center justify-center text-black text-xs">X</button>

    <!-- FULLSCREEN IMAGE SLIDER -->

    <script>
        /* ==========================================================================
           SLIDE DATA ARRAY (12 SLIDES FULL CONTENT) - UPDATED TO INCLUDE COVER SLIDE
           ========================================================================== */
        const slidesData = [
            {
                id: 1,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_06 AM (7).png" class="max-w-full max-h-full object-contain"></div>`

            {

                subtitle: "",

                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_06 AM (8).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 3,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_07 AM (9).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 4,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_08 AM (10).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 5,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_08 AM (11).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 6,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_09 AM (12).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 7,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_10 AM (13).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 8,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_10 AM (14).png" class="max-w-full max-h-full object-contain"></div>`
            },
            {
                id: 9,
                section: "",
                title: "",
                subtitle: "",
                badge: "",
                content: `<div class="w-full h-full flex items-center justify-center cursor-pointer" onclick="nextSlide()"><img src="images_slide/ChatGPT Image Sep 17, 2026, 01_25_11 AM (15).png" class="max-w-full max-h-full object-contain"></div>`
            }
        ];

        /* ==========================================================================
           APPLICATION STATE & AUDIO SYNTHESIZER
           ========================================================================== */
        let currentSlide = 0;
        let soundEnabled = true;

        // Web Audio API Retro Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 440, type = 'square', duration = 0.08) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function playChime() {
            if (!soundEnabled) return;
            playBeep(523.25, 'triangle', 0.1); // C5
            setTimeout(() => playBeep(659.25, 'triangle', 0.1), 80); // E5
            setTimeout(() => playBeep(783.99, 'triangle', 0.15), 160); // G5
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.innerHTML = '🔊';
                showRetroModal('Sound System', 'Sound Effects: ENABLED');
                playChime();
            } else {
                icon.innerHTML = '🔇';
                showRetroModal('Sound System', 'Sound Effects: MUTED');
            }
        }

        /* ==========================================================================
           SLIDE RENDER & NAVIGATION LOGIC
           ========================================================================== */
        function renderSlide(index) {
            const slide = slidesData[index];
            const viewport = document.getElementById('slideViewport');
            const content = document.getElementById('slideContent');

            // Apply slide transition animation
            viewport.classList.remove('slide-enter');
            void viewport.offsetWidth; // Trigger reflow
            viewport.classList.add('slide-enter');

            // Update UI Elements
            document.getElementById('slideCounter').innerText = `${slide.id} / ${slidesData.length}`;
            document.getElementById('taskbarTitle').innerText = `${slide.id}. ${slide.title ? slide.title.replace(/<[^>]*>?/gm, '') : 'Cover Page'}`;
            
            const progressPercent = ((slide.id) / slidesData.length) * 100;
            document.getElementById('slideProgressBar').style.width = `${progressPercent}%`;

            // Render Slide HTML Structure
            let slideHeaderHTML = '';
            // Only show the header if there is a title (hide on cover page for cleaner look)
            if (slide.title) {
                slideHeaderHTML = `
                    <div>
                        <!-- Header Bar inside Slide -->
                        <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-gray-300 pb-2 mb-3">
                            <div>
                                <span class="text-xs font-bold text-blue-800 tracking-widest block uppercase font-pixel-body">${slide.section}</span>
                                <h2 class="font-pixel-heading text-sm sm:text-lg text-gray-900 mt-1">${slide.title}</h2>
                            </div>
                            <span class="win-outset px-2 py-0.5 bg-yellow-200 text-xs font-bold text-gray-800 font-pixel-body">
                                ${slide.badge}
                            </span>
                        </div>
                        <p class="text-base text-gray-700 italic mb-3 font-semibold">${slide.subtitle}</p>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="flex flex-col h-full justify-between">
                    ${slideHeaderHTML}
                    <!-- Slide Body -->
                    <div class="flex-1 my-2 h-full flex flex-col justify-center">
                        ${slide.content}
                    </div>
                </div>
            `;

            // Update Navigation Buttons State
            document.getElementById('btnPrev').disabled = (index === 0);
            document.getElementById('btnNext').disabled = (index === slidesData.length - 1);
            
            document.getElementById('btnPrev').style.opacity = (index === 0) ? '0.5' : '1';
            document.getElementById('btnNext').style.opacity = (index === slidesData.length - 1) ? '0.5' : '1';

            // Close start menu if open
            document.getElementById('startMenu').classList.add('hidden');
        }

        window.nextSlide = function() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                playBeep(600, 'square', 0.05);
                renderSlide(currentSlide);
            }
        };

        window.prevSlide = function() {
            if (currentSlide > 0) {
                currentSlide--;
                playBeep(400, 'square', 0.05);
                renderSlide(currentSlide);
            }
        };

        window.goToSlide = function(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlide = index;
                playChime();
                renderSlide(currentSlide);
            }
        };

        /* ==========================================================================
           FULLSCREEN SLIDER LOGIC
           ========================================================================== */

        window.openFullScreenSlider = function() {
            document.getElementById('fullScreenSlider').classList.remove('hidden');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            }
            // Close start menu if open
            const startMenu = document.getElementById('startMenu');
            if (startMenu) startMenu.classList.add('hidden');
        };

        window.closeFullScreenSlider = function() {
            document.getElementById('fullScreenSlider').classList.add('hidden');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(e => console.log(e));
            }
        };

        /* ==========================================================================
           KEYBOARD CONTROLS & EVENT LISTENERS
           ========================================================================== */
        document.addEventListener('keydown', (e) => {
            const fullSlider = document.getElementById('fullScreenSlider');
            if (fullSlider && !fullSlider.classList.contains('hidden')) {
                if (e.key === 'Escape') {
                    closeFullScreenSlider();
                }
                return;
            }

            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(slidesData.length - 1);
            }
        });

        /* ==========================================================================
           INTERACTIVE SLIDE WIDGETS & DEMO LOGIC
           ========================================================================== */
        // Slide 2 Demo
        let demoWater = 40;
        window.interactFarmDemo = function() {
            const answer = prompt("💧 ตอบโจทย์คณิตศาสตร์ปราบหนอน/รดน้ำ:\\n7 + 8 = ?");
            if (answer === "15") {
                playChime();
                demoWater = Math.min(100, demoWater + 30);
                document.getElementById('demoWaterBar').style.width = demoWater + '%';
                if (demoWater >= 90) {
                    document.getElementById('demoPlant').innerText = '🌽';
                    document.getElementById('demoStage').innerText = 'สถานะ: ข้าวโพดพร้อมเก็บเกี่ยว! (+100 เหรียญ)';
                } else if (demoWater >= 60) {
                    document.getElementById('demoPlant').innerText = '🌿';
                    document.getElementById('demoStage').innerText = 'สถานะ: พืชเติบโตสมบูรณ์';
                }
            } else if (answer !== null) {
                playBeep(150, 'sawtooth', 0.2);
                showRetroModal('Incorrect Answer', '❌ คำตอบไม่ถูกต้อง! พืชยังไม่ได้รดน้ำ');
            }
        };

        // Slide 3 Idea Generator
        window.generateGameIdea = function() {
            playChime();
            const subject = document.getElementById('subjectInput').value || "วิชาทั่วไป";
            const obstacle = document.getElementById('obstacleInput').value || "อุปสรรคประจำวัน";
            const resultBox = document.getElementById('ideaResult');
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
                🚀 <strong>แนวคิดเกมของคุณ:</strong> "เกม ${subject} Quest - ปราบ ${obstacle} ด้วยความรู้!"<br>
                <span class="text-sm font-normal text-gray-700">กลไก: เมื่อผู้เรียนเผชิญหน้ากับ ${obstacle} ต้องตอบโจทย์วิชา ${subject} ให้ถูกต้องเพื่อเดินทางต่อ!</span>
            `;
        };

        // Celebration Fireworks Effect
        window.triggerWin95Celebration = function() {
            playChime();
            showRetroModal('🎉 Congratulations!', 'ยินดีด้วย! คุณพร้อมแล้วสำหรับการจัดอบรมสร้างเกมด้วย Gemini Canvas!<br>ขอให้สนุกและราบรื่นนะครับ!');
        };

        /* ==========================================================================
           UI POPUP MODALS & TASKBAR LOGIC
           ========================================================================== */
        window.showRetroModal = function(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('retroModal').classList.remove('hidden');
        };

        window.closeRetroModal = function() {
            playBeep(300, 'square', 0.05);
            document.getElementById('retroModal').classList.add('hidden');
        };

        window.toggleStartMenu = function() {
            playBeep(500, 'square', 0.05);
            const startMenu = document.getElementById('startMenu');
            startMenu.classList.toggle('hidden');
        };

        function buildStartMenu() {
            const listContainer = document.getElementById('startMenuList');
            listContainer.innerHTML = '';
            fullSlidesData.forEach((slide, index) => {
                const item = document.createElement('div');
                item.className = "p-1.5 hover:bg-blue-800 hover:text-white cursor-pointer flex items-center gap-2 rounded-xs";
                item.innerHTML = `<span class="font-bold text-xs">${index + 1}.</span> <span class="truncate">Slide ${index + 1}</span>`;
                item.onclick = () => {
                    playChime();
                    openFullScreenSlider(index);
                };
                listContainer.appendChild(item);
            });
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('winClock').innerText = `${hours}:${minutes} ${ampm}`;
        }

        
        window.openMainWindow = function() {
            document.getElementById('mainWindow').classList.remove('hidden');
            document.getElementById('taskbarApp').classList.remove('hidden');
        };

        window.minimizeMainWindow = function() {
            document.getElementById('mainWindow').classList.add('hidden');
        };

        window.closeMainWindow = function() {
            document.getElementById('mainWindow').classList.add('hidden');
            document.getElementById('taskbarApp').classList.add('hidden');
        };

        let isMaximized = false;
        window.maximizeMainWindow = function() {
            const win = document.getElementById('mainWindow');
            const viewport = document.getElementById('slideViewport');
            isMaximized = !isMaximized;
            if (isMaximized) {
                win.classList.remove('my-auto', 'mx-auto', 'w-[96vw]', 'max-w-5xl', 'h-[86vh]', 'rounded-xs');
                win.classList.add('absolute', 'top-0', 'left-0', 'w-full', 'h-[calc(100vh-2.5rem)]', 'rounded-none');
                if (viewport) viewport.style.zoom = '1.4';
            } else {
                win.classList.add('my-auto', 'mx-auto', 'w-[96vw]', 'max-w-5xl', 'h-[86vh]', 'rounded-xs');
                win.classList.remove('absolute', 'top-0', 'left-0', 'w-full', 'h-[calc(100vh-2.5rem)]', 'rounded-none');
                if (viewport) viewport.style.zoom = '1';
            }
        };

        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        };

        /* ==========================================================================
           INITIALIZATION ON WINDOW LOAD
           ========================================================================== */
        window.onload = function() {
            renderSlide(currentSlide);
            buildStartMenu();
            updateClock();
            setInterval(updateClock, 1000);

            // Close start menu when clicking outside
            document.addEventListener('click', (e) => {
                const startMenu = document.getElementById('startMenu');
                const btnStart = document.getElementById('btnStart');
                if (!startMenu.contains(e.target) && !btnStart.contains(e.target)) {
                    startMenu.classList.add('hidden');
                }
            });
        };
    </script>
</body>
</html>
